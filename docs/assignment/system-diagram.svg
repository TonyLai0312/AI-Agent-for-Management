arch; BDR workflow</text><text x="998" y="207" class="body">Retrieved content = untrusted evidence</text><rect x="60" y="325" width="360" height="120" rx="12" fill="white" stroke="#007f78" stroke-width="2"/><text x="78" y="355" class="head">Confirmation gates</text><text x="78" y="381" class="body">Contact → industry → reference / none</text><text x="78" y="407" class="body">Draft → edit → approve → copy</text><rect x="520" y="325" width="360" height="120" rx="12" fill="white" stroke="#007f78" stroke-width="2"/><text x="538" y="355" class="head">Persistent PGlite database</text><text x="538" y="381" class="body">One owner; /var/data/evox/pg</text><text x="538" y="407" class="body">Evidence, approvals, drafts, sends, outbox</text><rect x="980" y="325" width="360" height="120" rx="12" fill="white" stroke="#007f78" stroke-width="2"/><text x="998" y="355" class="head">Protected overdue job</text><text x="998" y="381" class="body">Atomic claim; latest-status recheck</text><text x="998" y="407" class="body">Frozen Gmail draft; uncertain = reconcile</text><rect x="60" y="515" width="360" height="100" rx="12" fill="white" stroke="#007f78" stroke-width="2"/><text x="78" y="545" class="head">BDR sends outreach manually</text><text x="78" y="571" class="body">LinkedIn / email outside EVOX</text><text x="78" y="597" class="body">Actual send time recorded separately</text><rect x="520" y="515" width="360" height="100" rx="12" fill="white" stroke="#007f78" stroke-width="2"/><text x="538" y="545" class="head">Calendar and test isolation</text><text x="538" y="571" class="body">Five working days; same local time</text><text x="538" y="597" class="body">Live clock ≠ admin-only test clock</text><rect x="980" y="515" width="360" height="100" rx="12" fill="white" stroke="#007f78" stroke-width="2"/><text x="998" y="545" class="head">Sibling HTTP scheduler</text><text x="998" y="571" class="body">CRON_SECRET; one-minute checks</text><text x="998" y="597" class="body">Protected live and i